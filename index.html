    /**
     * Menghasilkan hash SHA-256 menggunakan Web Crypto API (HTTPS / GitHub Pages)
     * dengan fallback otomatis agar tetap berjalan jika file dibuka secara lokal.
     */
    async function sha256Hex(message) {
      const str = String(message);
      if (typeof window !== 'undefined' && window.crypto && window.crypto.subtle) {
        try {
          const msgBuffer = new TextEncoder().encode(str);
          const hashBuffer = await window.crypto.subtle.digest('SHA-256', msgBuffer);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          return hashArray.map((b) => b.toString(16).padStart(2, '0')).join('');
        } catch (e) {}
      }
      // Fallback SHA-256 murni JavaScript
      const K = [
        0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
        0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
        0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
        0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
        0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
        0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
        0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
        0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
      ];
      const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
      const bytes = new TextEncoder().encode(str);
      const l = bytes.length * 8;
      const padded = new Uint8Array((((bytes.length + 8) >> 6) + 1) * 64);
      padded.set(bytes);
      padded[bytes.length] = 0x80;
      const view = new DataView(padded.buffer);
      view.setUint32(padded.length - 4, l >>> 0, false);
      const w = new Uint32Array(64);
      const rotr = (n, x) => (x >>> n) | (x << (32 - n));
      for (let i = 0; i < padded.length; i += 64) {
        for (let t = 0; t < 16; t++) w[t] = view.getUint32(i + t * 4, false);
        for (let t = 16; t < 64; t++) {
          const s0 = rotr(7, w[t - 15]) ^ rotr(18, w[t - 15]) ^ (w[t - 15] >>> 3);
          const s1 = rotr(17, w[t - 2]) ^ rotr(19, w[t - 2]) ^ (w[t - 2] >>> 10);
          w[t] = (w[t - 16] + s0 + w[t - 7] + s1) >>> 0;
        }
        let [a, b, c, d, e, f, g, h] = H;
        for (let t = 0; t < 64; t++) {
          const S1 = rotr(6, e) ^ rotr(11, e) ^ rotr(25, e);
          const ch = (e & f) ^ (~e & g);
          const temp1 = (h + S1 + ch + K[t] + w[t]) >>> 0;
          const S0 = rotr(2, a) ^ rotr(13, a) ^ rotr(22, a);
          const maj = (a & b) ^ (a & c) ^ (b & c);
          const temp2 = (S0 + maj) >>> 0;
          h = g; g = f; f = e; e = (d + temp1) >>> 0;
          d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
        }
        H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0;
        H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
        H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0;
        H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
      }
      return H.map((x) => x.toString(16).padStart(8, '0')).join('');
    }

    function generateSecureToken() {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return 'tk-' + Math.random().toString(36).substring(2) + Date.now().toString(36);
    }

    function compressImageToDataURL(file, maxWidth = 640, quality = 0.78, preserveTransparency = false) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const isTransparentType =
              preserveTransparency ||
              file.type === 'image/png' ||
              file.type === 'image/webp' ||
              file.type === 'image/svg+xml';
            resolve(
              isTransparentType
                ? canvas.toDataURL('image/png')
                : canvas.toDataURL('image/jpeg', quality)
            );
          };
          img.onerror = () => reject(new Error('Gagal memproses file gambar.'));
          img.src = event.target.result;
        };
        reader.onerror = () => reject(new Error('Gagal membaca file gambar.'));
        reader.readAsDataURL(file);
      });
    }

    function formatDateTimeID(dateInput) {
      if (!dateInput) return '-';
      try {
        const date =
          typeof dateInput?.toDate === 'function'
            ? dateInput.toDate()
            : new Date(dateInput);
        if (isNaN(date.getTime())) return '-';
        return new Intl.DateTimeFormat('id-ID', {
          day: '2-digit',
          month: 'short',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        }).format(date);
      } catch {
        return '-';
      }
    }

          return {
            config: { ...DEFAULT_ELECTION_CONFIG, ...(parsed.config || {}) },
            students: Array.isArray(parsed.students) ? parsed.students : SAMPLE_STUDENTS,
            candidates: Array.isArray(parsed.candidates) ? parsed.candidates : SAMPLE_CANDIDATES,
            ballots: Array.isArray(parsed.ballots) ? parsed.ballots : [],
            tokens: parsed.tokens && typeof parsed.tokens === 'object' ? parsed.tokens : {},
            auditLogs: Array.isArray(parsed.auditLogs) ? parsed.auditLogs : [],
            adminAuth: parsed.adminAuth || null

      period = '2026 / 2027',
      variant = 'table'
    }) {
      const sortedCandidates = useMemo(() => {
        const activeList = candidates.filter((c) => c.isActive !== false);
        const source = activeList.length > 0 ? activeList : candidates;
        return source.slice().sort((a, b) => Number(a.nomorUrut) - Number(b.nomorUrut));
      }, [candidates]);

      const isCompact = variant === 'compact';
      const isModal = variant === 'modal';

      const colGridClass =
        sortedCandidates.length <= 1
          ? 'grid-cols-1 max-w-xs mx-auto'
          : sortedCandidates.length === 2
          ? 'grid-cols-2'
          : 'grid-cols-2 sm:grid-cols-3';

      return (
        <div
          className={`bg-[#FDFBF7] rounded-2xl border border-slate-300 shadow-sm overflow-hidden select-none ${
            isCompact ? 'p-2.5' : isModal ? 'p-4 sm:p-5' : 'p-3.5'

        >
          <div
            className={`flex items-center justify-between gap-2 border-b border-slate-300 ${
              isCompact ? 'pb-2 mb-2' : 'pb-3 mb-3'

          >
            <div className="flex items-center gap-2 min-w-0">
              <HimafaLogo size={isCompact ? 22 : 30} className="shrink-0" />
              <div className="min-w-0">
                <p
                  className={`font-bold tracking-wider text-slate-900 uppercase truncate ${
                    isCompact ? 'text-[9px]' : 'text-xs'

                  isCompact ? 'px-1.5 py-0.5 text-[9px]' : 'px-2.5 py-1 text-[11px]'
                }`}
              >
                #{String(ballot.ballotNumber || 1).padStart(3, '0')}
              </span>
              {!isCompact && (
                <span className="px-2 py-1 rounded-md bg-emerald-50 text-emerald-700 font-semibold text-[10px] border border-emerald-200">
                  SAH
                </span>
              )}
            </div>
          </div>

          <div className={`grid ${colGridClass} ${isCompact ? 'gap-2' : 'gap-3'}`}>
            {sortedCandidates.map((cand) => {
              const isPunched =
                cand.id === ballot.candidateId ||
                Number(cand.nomorUrut) === Number(ballot.nomorUrut);

              return (
                <div
                  key={cand.id}
                  className={`rounded-xl overflow-hidden flex flex-col border transition-all ${
                    isPunched
                      ? 'border-slate-900 ring-1 ring-slate-900/20 bg-white shadow-sm'
                      : 'border-slate-200 bg-white opacity-85'
                  }`}
                >
                  <div
                    className={`flex items-center justify-between bg-slate-900 text-white ${
                      isCompact ? 'px-2 py-1' : 'px-2.5 py-1.5'
                    }`}

                    <span
                      className={`font-bold text-slate-100 ${
                        isCompact ? 'text-[10px]' : 'text-xs'
                      }`}
                    >
                      0{cand.nomorUrut}

                      <span

                      >
                        DICOBLOS
                      </span>
                    ) : (
                      <span
                        className={`text-slate-400 font-medium ${
                          isCompact ? 'text-[7px]' : 'text-[9px]'

                      >
                        PASLON 0{cand.nomorUrut}
                      </span>
                    )}
                  </div>

                  <div className="relative aspect-[3/4] bg-slate-900 w-full overflow-hidden">
                    <img
                      src={
                        cand.posterData ||
                        createDefaultPosterSVG(
                          cand.nomorUrut,
                          cand.namaKetua,
                          cand.namaWakil
                        )
                      }
                      alt={`Kotak Paslon 0${cand.nomorUrut}`}
                      className="w-full h-full object-cover object-top"
                    />
                    {isPunched && (
                      <NailPunctureMark
                        x={ballot.punchX}
                        y={ballot.punchY}
                        size={isCompact ? 'sm' : isModal ? 'lg' : 'md'}

                  <div
                    className={`border-t border-slate-200 bg-white text-center ${
                      isCompact ? 'p-1.5' : 'p-2'

                        isCompact ? 'text-[9px]' : 'text-[11px]'

                        isCompact ? 'text-[8px]' : 'text-[10px]'

          <div
            className={`flex items-center justify-between border-t border-dashed border-slate-300 text-slate-400 font-mono ${
              isCompact ? 'mt-2 pt-1.5 text-[8px]' : 'mt-3 pt-2 text-[10px]'

          >
            <span>1 Lubang Paku • Suara Sah</span>
            <span>#HMF-{ballot.ballotHash?.slice(0, 10).toUpperCase()}</span>
          </div>
        </div>
      );

    // ============================================================================
    // 5. KOMPONEN UI GLOBAL (TOAST & MODAL KONFIRMASI)
    // ============================================================================
    function ToastContainer({ toasts, removeToast }) {
      return (
        <div className="fixed top-4 right-4 z-[100] flex flex-col gap-2.5 max-w-sm w-full pointer-events-none px-4 sm:px-0">
          {toasts.map((toast) => {
            const styles = {
              success: 'bg-slate-900 text-white border-emerald-400/60 shadow-emerald-950/30',
              error: 'bg-slate-900 text-white border-rose-400/60 shadow-rose-950/30',
              warning: 'bg-slate-900 text-white border-amber-400/60 shadow-amber-950/30',
              info: 'bg-slate-900 text-white border-blue-400/60 shadow-blue-950/30'
            };
            const icons = {
              success: <CheckCircle2 className="w-5 h-5 text-emerald-400 shrink-0" />,
              error: <XCircle className="w-5 h-5 text-rose-400 shrink-0" />,
              warning: <AlertTriangle className="w-5 h-5 text-amber-400 shrink-0" />,
              info: <Info className="w-5 h-5 text-blue-400 shrink-0" />
            };
            return (
              <div
                key={toast.id}
                className={`pointer-events-auto flex items-start gap-3 p-4 rounded-xl border backdrop-blur-md shadow-xl transition-all duration-300 animate-slideInRight ${
                  styles[toast.type] || styles.info
                }`}
              >
                {icons[toast.type] || icons.info}
                <div className="flex-1 text-sm leading-relaxed">
                  {toast.title && <p className="font-semibold text-white mb-0.5">{toast.title}</p>}
                  <p className="text-slate-200 text-xs sm:text-sm">{toast.message}</p>
                </div>
                <button
                  onClick={() => removeToast(toast.id)}
                  className="text-slate-400 hover:text-white p-1 rounded-lg transition-colors"
                  aria-label="Tutup notifikasi"
                >
                  <X className="w-4 h-4" />
                </button>
              </div>
            );
          })}
        </div>
      );
    }

    function ConfirmDialog({
      open,
      title,
      message,
      confirmLabel = 'Konfirmasi',
      cancelLabel = 'Batal',
      variant = 'danger',
      onConfirm,
      onCancel
    }) {
      if (!open) return null;
      const btnStyle =
        variant === 'danger'
          ? 'bg-rose-600 hover:bg-rose-700 text-white'
          : 'bg-[#0A192F] hover:bg-[#1E40AF] text-white';
      return (
        <div className="fixed inset-0 z-[90] flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm animate-fadeIn">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
            <div className="flex items-center gap-3 mb-3">
              <div
                className={`p-2.5 rounded-xl ${
                  variant === 'danger' ? 'bg-rose-100 text-rose-600' : 'bg-amber-100 text-amber-600'
                }`}
              >
                <AlertTriangle className="w-6 h-6" />
              </div>
              <h3 className="text-lg font-bold text-slate-900">{title}</h3>
            </div>
            <p className="text-slate-600 text-sm leading-relaxed mb-6">{message}</p>
            <div className="flex items-center justify-end gap-3">
              <button
                type="button"
                onClick={onCancel}
                className="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 transition-colors"
              >
                {cancelLabel}
              </button>
              <button
                type="button"
                onClick={onConfirm}
                className={`px-5 py-2.5 rounded-xl text-sm font-semibold shadow-sm transition-colors ${btnStyle}`}
              >
                {confirmLabel}
              </button>
            </div>
          </div>
        </div>
      );
    }

        <Lock key="p3" className="w-4 h-4 text-slate-700" />,

      const luberJurdilItems = useMemo(() => {
        const source =
          Array.isArray(config.principles) && config.principles.length > 0
            ? config.principles
            : DEFAULT_PRINCIPLES;
        return source.map((item, idx) => ({
          title: item.title || DEFAULT_PRINCIPLES[idx]?.title || `Asas ${idx + 1}`,
          desc: item.desc || DEFAULT_PRINCIPLES[idx]?.desc || '',
          icon: principleIcons[idx % principleIcons.length]
        }));

      const publicTally = useMemo(() => {
        const counts = {};
        candidates.forEach((c) => {

        ballots.forEach((b) => {
          if (counts[b.candidateId] !== undefined) {
            counts[b.candidateId] += 1;
          }
        });
        const totalValid = ballots.length;
        return candidates
          .slice()
          .sort((a, b) => Number(a.nomorUrut) - Number(b.nomorUrut))
          .map((c) => ({
            ...c,
            votes: counts[c.id] || 0,
            percentage: totalValid > 0 ? ((counts[c.id] || 0) / totalValid) * 100 : 0

    // ============================================================================
    // 7. KOMPONEN HALAMAN 2 — FORMULIR IDENTITAS & VERIFIKASI DPT PEMILIH
    // ============================================================================
    function VoterVerificationPage({
      students,
      onBackHome,
      onCreateVoterSession,
      showToast
    }) {
      const [nim, setNim] = useState('');
      const [nama, setNama] = useState('');
      const [prodi, setProdi] = useState('');
      const [angkatan, setAngkatan] = useState('');
      const [isVerifying, setIsVerifying] = useState(false);

      const matchedStudent = useMemo(() => {
        const cleanNim = nim.trim();
        if (!cleanNim) return null;
        return students.find((s) => String(s.nim).trim() === cleanNim) || null;
      }, [nim, students]);

      useEffect(() => {
        if (matchedStudent) {
          setNama(matchedStudent.nama || '');
          setProdi(matchedStudent.prodi || '');
          setAngkatan(String(matchedStudent.angkatan || ''));
        } else {
          setNama('');
          setProdi('');
          setAngkatan('');
        }
      }, [matchedStudent]);

      const verificationStatus = useMemo(() => {
        const cleanNim = nim.trim();
        if (!cleanNim) {
          return {
            state: 'IDLE',
            message: 'Masukkan Nomor Induk Mahasiswa (NIM) Anda untuk verifikasi DPT.'
          };
        }
        if (!matchedStudent) {
          return {
            state: 'NOT_FOUND',
            message:
              'NIM tidak terdaftar dalam Daftar Pemilih Tetap (DPT) HIMAFA. Hubungi panitia KPUM jika terjadi kesalahan.'
          };
        }
        if (matchedStudent.hasVoted) {
          return {
            state: 'ALREADY_VOTED',
            message: `Hak pilih untuk NIM ${matchedStudent.nim} telah digunakan pada ${formatDateTimeID(
              matchedStudent.votedAt
            )}. Sistem menolak pemilihan berulang.`
          };
        }
        if (!matchedStudent.eligibility) {
          return {
            state: 'INELIGIBLE',
            message:
              'Status kemahasiswaan Anda tercatat tidak memiliki hak pilih aktif pada periode ini.'
          };
        }
        return {
          state: 'VALID',
          message: 'Identitas terverifikasi dalam DPT HIMAFA dan hak pilih tersedia.'
        };
      }, [nim, matchedStudent]);

      const handleProceed = async (e) => {
        e.preventDefault();
        if (verificationStatus.state !== 'VALID' || !matchedStudent) {
          showToast('error', 'Verifikasi Gagal', verificationStatus.message);
          return;
        }
        if (!nama.trim() || !prodi.trim() || !angkatan.trim()) {
          showToast(
            'warning',
            'Data Belum Lengkap',
            'Pastikan seluruh kolom identitas terisi dengan benar.'
          );
          return;
        }

        setIsVerifying(true);
        try {
          const sessionObj = await onCreateVoterSession(matchedStudent.nim);
          if (sessionObj) {
            showToast(
              'success',
              'Verifikasi Berhasil',
              'Sesi surat suara sekali pakai berhasil dibuat. Silakan buka amplop pemilihan Anda.'
            );
          }
        } catch (err) {
          showToast('error', 'Kesalahan Sistem', err.message || 'Gagal membuat sesi pemilihan.');
        } finally {
          setIsVerifying(false);
        }
      };

      return (
        <div className="min-h-screen bg-[#F8FAFC] flex flex-col">
          <header className="bg-white border-b border-slate-200">
            <div className="max-w-5xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <HimafaLogo size={34} />
                <div>
                  <p className="font-bold text-sm text-slate-900">Verifikasi Identitas Pemilih</p>
                  <p className="text-xs text-slate-500">Langkah 1 dari 3 • E-Voting HIMAFA</p>
                </div>
              </div>
              <button
                type="button"
                onClick={onBackHome}
                className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors"
              >
                <ChevronLeft className="w-3.5 h-3.5" />
                <span>Beranda</span>
              </button>
            </div>
          </header>

          <div className="bg-white border-b border-slate-200/70">
            <div className="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between text-xs font-medium">
              <div className="flex items-center gap-2 text-slate-900 font-semibold">
                <span className="w-5 h-5 rounded-full bg-slate-900 text-white flex items-center justify-center text-[11px]">
                  1
                </span>
                <span>Verifikasi DPT</span>
              </div>
              <div className="h-px flex-1 mx-3 bg-slate-200" />
              <div className="flex items-center gap-2 text-slate-400">
                <span className="w-5 h-5 rounded-full bg-slate-100 border border-slate-200 text-slate-500 flex items-center justify-center text-[11px]">
                  2
                </span>
                <span>Amplop Surat Suara</span>
              </div>
              <div className="h-px flex-1 mx-3 bg-slate-200" />
              <div className="flex items-center gap-2 text-slate-400">
                <span className="w-5 h-5 rounded-full bg-slate-100 border border-slate-200 text-slate-500 flex items-center justify-center text-[11px]">
                  3
                </span>
                <span>Pemilihan Paslon</span>
              </div>
            </div>
          </div>

          <main className="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-10">
            <div className="w-full max-w-lg bg-white rounded-2xl shadow-sm border border-slate-200/90 overflow-hidden animate-fadeIn">
              <div className="px-6 sm:px-8 pt-7 pb-5 border-b border-slate-100">
                <div className="inline-flex items-center gap-1.5 text-slate-500 text-xs font-medium mb-1.5">
                  <ShieldCheck className="w-3.5 h-3.5 text-slate-700" />
                  <span>Autentikasi Daftar Pemilih Tetap</span>
                </div>
                <h1 className="text-xl font-bold text-slate-900">
                  Formulir Identitas Mahasiswa
                </h1>
                <p className="text-xs sm:text-sm text-slate-500 mt-1">
                  Masukkan NIM Anda. Data akademik akan dicocokkan otomatis dengan database DPT resmi HIMAFA.
                </p>
              </div>

              <form onSubmit={handleProceed} className="p-6 sm:p-8 space-y-5">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1.5">
                    1. Nomor Induk Mahasiswa (NIM) <span className="text-rose-500">*</span>
                  </label>
                  <div className="relative">
                    <input
                      type="text"
                      value={nim}
                      onChange={(e) => setNim(e.target.value)}
                      placeholder="Contoh: 220105001"
                      autoFocus
                      className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-slate-900 focus:ring-2 focus:ring-slate-900/10 focus:outline-none text-sm font-mono font-semibold text-slate-900 transition-all"
                    />
                    {verificationStatus.state === 'VALID' && (
                      <CheckCircle2 className="w-4 h-4 text-emerald-600 absolute right-3.5 top-1/2 -translate-y-1/2" />
                    )}
                  </div>
                </div>

                {nim.trim() !== '' && (
                  <div
                    className={`p-3.5 rounded-xl border text-xs flex items-start gap-2.5 transition-all ${
                      verificationStatus.state === 'VALID'
                        ? 'bg-emerald-50/70 border-emerald-200 text-emerald-900'
                        : verificationStatus.state === 'ALREADY_VOTED'
                        ? 'bg-amber-50/70 border-amber-200 text-amber-900'
                        : 'bg-rose-50/70 border-rose-200 text-rose-900'
                    }`}
                  >
                    {verificationStatus.state === 'VALID' ? (
                      <CheckCircle2 className="w-4 h-4 text-emerald-600 shrink-0 mt-0.5" />
                    ) : verificationStatus.state === 'ALREADY_VOTED' ? (
                      <Lock className="w-4 h-4 text-amber-600 shrink-0 mt-0.5" />
                    ) : (
                      <XCircle className="w-4 h-4 text-rose-600 shrink-0 mt-0.5" />
                    )}
                    <div>
                      <p className="font-semibold mb-0.5">
                        {verificationStatus.state === 'VALID'
                          ? 'Mahasiswa Terdaftar & Berhak Memilih'
                          : verificationStatus.state === 'ALREADY_VOTED'
                          ? 'Suara Sudah Tercatat Sebelumnya'
                          : verificationStatus.state === 'INELIGIBLE'
                          ? 'Hak Pilih Tidak Aktif'
                          : 'NIM Tidak Ditemukan di DPT'}
                      </p>
                      <p className="leading-relaxed opacity-90">{verificationStatus.message}</p>
                    </div>
                  </div>
                )}

                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1.5">
                    2. Nama Lengkap Mahasiswa
                  </label>
                  <input
                    type="text"
                    value={nama}
                    readOnly
                    placeholder="Otomatis terisi setelah NIM terverifikasi"
                    className="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-800 font-medium text-sm cursor-not-allowed"
                  />
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1.5">
                      3. Program Studi
                    </label>
                    <div className="relative">
                      <GraduationCap className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                      <input
                        type="text"
                        value={prodi}
                        readOnly
                        placeholder="Otomatis dari DPT"
                        className="w-full pl-9 pr-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-800 font-medium text-sm cursor-not-allowed"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1.5">
                      4. Angkatan
                    </label>
                    <div className="relative">
                      <Building2 className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                      <input
                        type="text"
                        value={angkatan}
                        readOnly
                        placeholder="Tahun Angkatan"
                        className="w-full pl-9 pr-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-800 font-medium text-sm cursor-not-allowed"
                      />
                    </div>
                  </div>
                </div>

                <div className="bg-slate-50 border border-slate-200/70 rounded-xl p-3 flex items-start gap-2.5 text-xs text-slate-500">
                  <Lock className="w-3.5 h-3.5 text-slate-600 shrink-0 mt-0.5" />
                  <p className="leading-relaxed">
                    <strong className="text-slate-700">Jaminan Kerahasiaan:</strong> Identitas NIM hanya digunakan untuk memvalidasi status hak pilih dan menerbitkan token surat suara anonim.
                  </p>
                </div>

                <button
                  type="submit"
                  disabled={verificationStatus.state !== 'VALID' || isVerifying}
                  className={`w-full py-3.5 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 transition-all ${
                    verificationStatus.state === 'VALID' && !isVerifying
                      ? 'bg-slate-900 hover:bg-slate-800 text-white shadow-sm cursor-pointer'
                      : 'bg-slate-100 text-slate-400 border border-slate-200 cursor-not-allowed'
                  }`}
                >
                  {isVerifying ? (
                    <>
                      <RefreshCw className="w-4 h-4 animate-spin" />
                      <span>Menerbitkan Sesi Surat Suara...</span>
                    </>
                  ) : (
                    <>
                      <span>Lanjutkan</span>
                      <ArrowRight className="w-4 h-4" />
                    </>
                  )}
                </button>
              </form>
            </div>
          </main>
        </div>
      );
    }

            .sort((a, b) => Number(a.nomorUrut) - Number(b.nomorUrut)),
        [candidates]
      );

        [activeCandidates, selectedCandidateId]
      );

        setSelectedCandidateId(candidateId);
        setPunchCoords({ x: clampedX, y: clampedY });
        setIsPunching(true);

        if (punchTimerRef.current) clearTimeout(punchTimerRef.current);
        punchTimerRef.current = setTimeout(() => {
          setIsPunching(false);
        }, 750);

    // ============================================================================
    function VoteSuccessPage({ receiptHash, onCompleteReset }) {
      const [secondsLeft, setSecondsLeft] = useState(5);

      useEffect(() => {
        const interval = setInterval(() => {
          setSecondsLeft((prev) => {
            if (prev <= 1) {
              clearInterval(interval);
              onCompleteReset();
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(interval);
      }, [onCompleteReset]);

      return (
        <div className="min-h-screen bg-[#F8FAFC] text-slate-900 flex items-center justify-center p-4 sm:p-8">
          <div className="max-w-md w-full bg-white border border-slate-200/90 rounded-2xl p-8 sm:p-10 text-center shadow-sm animate-fadeIn">

            <div className="w-16 h-16 mx-auto mb-5 rounded-full bg-emerald-50 border border-emerald-200 flex items-center justify-center">
              <svg
                className="w-8 h-8 text-emerald-600"
                viewBox="0 0 52 52"
                fill="none"
              >
                <path
                  className="animate-drawCheck"
                  d="M14 27 L22 35 L38 18"
                  stroke="currentColor"
                  strokeWidth="4"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                />
              </svg>
            </div>

            <h1 className="text-2xl font-bold tracking-tight text-slate-900">
              Terima Kasih!
            </h1>
            <p className="text-base font-semibold text-emerald-700 mt-1">

            </p>
            <p className="text-xs sm:text-sm text-slate-500 mt-2.5 leading-relaxed">

        e.preventDefault();
        if (!username.trim() || !password.trim()) {
          showToast('warning', 'Form Belum Lengkap', 'Masukkan username dan password panitia.');
          return;
        }

        setLoading(true);
        try {
          const inputHash = await sha256Hex(password.trim());

          if (!adminAuth) {
            const defaultHash = await sha256Hex('panitia2026');
            onInitAdminAuth({
              username: 'admin_himafa',
              passwordHash: defaultHash,
              role: 'SUPER_ADMIN',
              updatedAt: new Date().toISOString()
            });

            if (username.trim() === 'admin_himafa' && inputHash === defaultHash) {
              onLoginSuccess('admin_himafa');
              setUsername('');
              setPassword('');
            } else {
              showToast('error', 'Autentikasi Gagal', 'Username atau password administrator salah.');
            }
          } else {
            if (username.trim() === adminAuth.username && inputHash === adminAuth.passwordHash) {
              onLoginSuccess(adminAuth.username);
              setUsername('');
              setPassword('');
            } else {
              showToast('error', 'Autentikasi Gagal', 'Username atau password administrator salah.');
            }
          }
        } catch (err) {
          showToast('error', 'Gagal Login', err.message || 'Terjadi kesalahan saat verifikasi.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div
          onClick={onClose}
          className="fixed inset-0 z-50 bg-slate-950/45 backdrop-blur-xs flex items-center justify-center p-4 animate-fadeIn"
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className="bg-white rounded-2xl max-w-sm w-full overflow-hidden shadow-xl border border-slate-200"
          >
            <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="p-2 rounded-lg bg-slate-100 text-slate-700">
                  <KeyRound className="w-4 h-4" />
                </div>
                <div>
                  <p className="text-[11px] text-slate-400">
                    Portal Komisi Pemilihan
                  </p>
                  <h2 className="text-sm font-bold text-slate-900">Login Administrator</h2>
                </div>
              </div>
              <button
                type="button"
                onClick={onClose}
                className="p-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600"
              >
                <X className="w-4 h-4" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1.5">
                  Username Panitia
                </label>
                <input
                  type="text"
                  value={username}
                  onChange={(e) => setUsername(e.target.value)}
                  placeholder="admin_himafa"
                  autoFocus
                  className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-slate-900 focus:outline-none text-sm font-medium"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1.5">
                  Kata Sandi
                </label>
                <div className="relative">
                  <input
                    type={showPass ? 'text' : 'password'}
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="••••••••••••"
                    className="w-full pl-3.5 pr-10 py-2.5 rounded-xl border border-slate-300 focus:border-slate-900 focus:outline-none text-sm font-medium"
                  />
                  <button
                    type="button"
                    onClick={() => setShowPass((p) => !p)}
                    className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 p-1"
                  >
                    {showPass ? <EyeOff className="w-4 h-4" /> : <Eye className="w-4 h-4" />}
                  </button>
                </div>
              </div>

              <div className="p-3 rounded-xl bg-[#F8FAFC] border border-slate-200/80 text-xs text-slate-500">
                <p className="font-medium text-slate-700 mb-0.5">Kredensial Pengujian:</p>
                <p>
                  Username: <code className="font-mono font-semibold text-slate-900">admin_himafa</code> • Password:{' '}
                  <code className="font-mono font-semibold text-slate-900">panitia2026</code>
                </p>
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full py-3 rounded-xl font-semibold text-sm bg-slate-900 hover:bg-slate-800 text-white flex items-center justify-center gap-2 transition-colors"
              >
                {loading ? (
                  <>
                    <RefreshCw className="w-4 h-4 animate-spin" />
                    <span>Memverifikasi...</span>
                  </>
                ) : (
                  <>
                    <Lock className="w-3.5 h-3.5" />
                    <span>Masuk ke Dashboard</span>
                  </>
                )}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 12. KOMPONEN DASHBOARD ADMINISTRATOR LENGKAP (6 MODUL)
    // ============================================================================
    function AdminDashboard({
      adminUser,
      config,
      students,
      candidates,
      ballots,
      auditLogs,
      onUpdateDb,
      onExportFullBackup,
      onImportFullBackup,
      onLogout,
      logAudit,
      showToast
    }) {
      const [activeTab, setActiveTab] = useState('overview');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [confirmState, setConfirmState] = useState({ open: false });

      // --- STATE MODUL B: MANAJEMEN PASLON ---
      const [editingCandidate, setEditingCandidate] = useState(null);
      const [candForm, setCandForm] = useState({
        nomorUrut: 1,
        namaKetua: '',
        namaWakil: '',
        posterData: '',
        fotoKetuaData: '',
        fotoWakilData: '',
        visi: '',
        misi: '',
        isActive: true
      });
      const [savingCand, setSavingCand] = useState(false);

      // --- STATE MODUL C: DATABASE MAHASISWA (DPT) ---
      const [studentSearch, setStudentSearch] = useState('');
      const [filterProdi, setFilterProdi] = useState('ALL');
      const [filterAngkatan, setFilterAngkatan] = useState('ALL');
      const [filterVoteStatus, setFilterVoteStatus] = useState('ALL');
      const [studentModalOpen, setStudentModalOpen] = useState(false);
      const [editingStudentNim, setEditingStudentNim] = useState(null);
      const [studentForm, setStudentForm] = useState({
        nim: '',
        nama: '',
        prodi: 'S1 Farmasi',
        angkatan: '2024',
        eligibility: true
      });
      const csvInputRef = useRef(null);
      const jsonBackupInputRef = useRef(null);

      // --- STATE MODUL D: MANAJEMEN PEMILIHAN ---
      const [electionForm, setElectionForm] = useState({
        ...DEFAULT_ELECTION_CONFIG,
        ...config
      });
      const [newAdminUsername, setNewAdminUsername] = useState(adminUser);
      const [newAdminPassword, setNewAdminPassword] = useState('');
      const [savingConfig, setSavingConfig] = useState(false);

      // --- STATE MODUL E: PERHITUNGAN SUARA MANUAL & INSPEKSI SURAT SUARA ---
      const [manualCountedLimit, setManualCountedLimit] = useState(null);
      const [isAutoCounting, setIsAutoCounting] = useState(false);
      const [ballotFilterPaslon, setBallotFilterPaslon] = useState('ALL');
      const [inspectedBallot, setInspectedBallot] = useState(null);

      useEffect(() => {
        setElectionForm((prev) => ({
          ...DEFAULT_ELECTION_CONFIG,
          ...prev,
          ...config,
          principles:
            Array.isArray(config.principles) && config.principles.length > 0
              ? config.principles
              : DEFAULT_PRINCIPLES
        }));
      }, [config]);

      const stats = useMemo(() => {
        const totalStudents = students.length;
        const eligibleStudents = students.filter((s) => s.eligibility).length;
        const votedStudents = students.filter((s) => s.hasVoted).length;
        const notVotedStudents = Math.max(0, eligibleStudents - votedStudents);
        const turnoutPct =
          eligibleStudents > 0 ? ((votedStudents / eligibleStudents) * 100).toFixed(1) : '0.0';
        const totalCandidates = candidates.filter((c) => c.isActive).length;

        const byAngkatan = {};
        students.forEach((s) => {
          const ang = String(s.angkatan || 'Lainnya');
          if (!byAngkatan[ang]) byAngkatan[ang] = { total: 0, voted: 0 };
          byAngkatan[ang].total += 1;
          if (s.hasVoted) byAngkatan[ang].voted += 1;
        });

        return {
          totalStudents,
          eligibleStudents,
          votedStudents,
          notVotedStudents,
          turnoutPct,
          totalCandidates,
          byAngkatan
        };
      }, [students, candidates]);

      const orderedBallots = useMemo(() => {
        return ballots
          .slice()
          .sort((a, b) => {
            const ta = a.createdAt ? new Date(a.createdAt).getTime() : 0;
            const tb = b.createdAt ? new Date(b.createdAt).getTime() : 0;
            return ta - tb;
          })
          .map((b, index) => ({
            ...b,
            ballotNumber: index + 1,
            punchX: typeof b.punchX === 'number' ? b.punchX : 50,
            punchY: typeof b.punchY === 'number' ? b.punchY : 46
          }));
      }, [ballots]);

      const effectiveCountedLength =
        manualCountedLimit === null
          ? orderedBallots.length
          : Math.min(manualCountedLimit, orderedBallots.length);

      const countedBallots = useMemo(
        () => orderedBallots.slice(0, effectiveCountedLength),
        [orderedBallots, effectiveCountedLength]
      );

      const latestCountedBallot =
        countedBallots.length > 0 ? countedBallots[countedBallots.length - 1] : null;

      useEffect(() => {
        if (!isAutoCounting) return;
        const timer = setInterval(() => {
          setManualCountedLimit((prev) => {
            const current = prev === null ? orderedBallots.length : prev;
            if (current >= orderedBallots.length) {
              setIsAutoCounting(false);
              return null;
            }
            return current + 1;
          });
        }, 1100);
        return () => clearInterval(timer);
      }, [isAutoCounting, orderedBallots.length]);

      const resultsData = useMemo(() => {
        const counts = {};
        candidates.forEach((c) => {
          counts[c.id] = 0;
        });
        countedBallots.forEach((b) => {
          if (counts[b.candidateId] !== undefined) {
            counts[b.candidateId] += 1;
          }
        });
        const totalValid = countedBallots.length;
        const palette = ['#0A192F', '#1E40AF', '#D4AF37', '#0D9488', '#6366F1'];

        return candidates
          .slice()
          .sort((a, b) => Number(a.nomorUrut) - Number(b.nomorUrut))
          .map((c, idx) => {
            const votes = counts[c.id] || 0;
            const pct = totalValid > 0 ? (votes / totalValid) * 100 : 0;
            return {
              ...c,
              votes,
              pct,
              color: palette[idx % palette.length]
            };
          });
      }, [candidates, countedBallots]);

      // ==========================================================================
      // HANDLER MODUL B: PASANGAN CALON
      // ==========================================================================
      const resetCandidateForm = () => {
        setEditingCandidate(null);
        setCandForm({
          nomorUrut: candidates.length + 1,
          namaKetua: '',
          namaWakil: '',
          posterData: '',
          fotoKetuaData: '',
          fotoWakilData: '',
          visi: '',
          misi: '',
          isActive: true
        });
      };

      const handleEditCandidate = (cand) => {
        setEditingCandidate(cand);
        setCandForm({
          nomorUrut: cand.nomorUrut,
          namaKetua: cand.namaKetua,
          namaWakil: cand.namaWakil,
          posterData: cand.posterData || '',
          fotoKetuaData: cand.fotoKetuaData || '',
          fotoWakilData: cand.fotoWakilData || '',
          visi: cand.visi || '',
          misi: cand.misi || '',
          isActive: cand.isActive !== false
        });
      };

      const handleImageUpload = async (e, fieldName, maxWidth = 640) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const compressed = await compressImageToDataURL(file, maxWidth, 0.78);
          setCandForm((prev) => ({ ...prev, [fieldName]: compressed }));
          showToast('success', 'Gambar Diproses', 'File berhasil dikompresi dan siap disimpan.');
        } catch (err) {
          showToast('error', 'Upload Gagal', err.message);
        }
      };

      const handleSaveCandidate = async (e) => {
        e.preventDefault();
        if (!candForm.namaKetua.trim() || !candForm.namaWakil.trim() || !candForm.visi.trim()) {
          showToast('warning', 'Data Wajib Kosong', 'Nama Ketua, Nama Wakil, dan Visi wajib diisi.');
          return;
        }

        setSavingCand(true);
        try {
          const candId = editingCandidate ? editingCandidate.id : generateSecureToken();
          const newCandObj = {
            id: candId,
            nomorUrut: Number(candForm.nomorUrut),
            namaKetua: candForm.namaKetua.trim(),
            namaWakil: candForm.namaWakil.trim(),
            posterData: candForm.posterData,
            fotoKetuaData: candForm.fotoKetuaData,
            fotoWakilData: candForm.fotoWakilData,
            visi: candForm.visi.trim(),
            misi: candForm.misi.trim(),
            isActive: Boolean(candForm.isActive),
            updatedAt: new Date().toISOString()
          };

          onUpdateDb((prev) => {
            const exists = prev.candidates.some((c) => c.id === candId);
            const nextCandidates = exists
              ? prev.candidates.map((c) => (c.id === candId ? newCandObj : c))
              : [...prev.candidates, newCandObj];
            return { ...prev, candidates: nextCandidates };
          });

          logAudit(
            editingCandidate ? 'EDIT_PASLON' : 'TAMBAH_PASLON',
            `${editingCandidate ? 'Memperbarui' : 'Menambahkan'} Paslon 0${candForm.nomorUrut}: ${candForm.namaKetua} & ${candForm.namaWakil}`
          );

          showToast(
            'success',
            'Paslon Tersimpan',
            `Data Pasangan Calon 0${candForm.nomorUrut} berhasil diperbarui.`
          );
          resetCandidateForm();
        } catch (err) {
          showToast('error', 'Gagal Menyimpan Paslon', err.message);
        } finally {
          setSavingCand(false);
        }
      };

      const handleDeleteCandidate = (cand) => {
        setConfirmState({
          open: true,
          title: `Hapus Paslon 0${cand.nomorUrut}?`,
          message: `Anda yakin ingin menghapus pasangan calon ${cand.namaKetua} & ${cand.namaWakil}? Tindakan ini tidak mengubah surat suara yang sudah sah tercatat.`,
          confirmLabel: 'Ya, Hapus Paslon',
          onConfirm: () => {
            setConfirmState({ open: false });
            onUpdateDb((prev) => ({
              ...prev,
              candidates: prev.candidates.filter((c) => c.id !== cand.id)
            }));
            logAudit(
              'HAPUS_PASLON',
              `Menghapus Paslon 0${cand.nomorUrut}: ${cand.namaKetua} & ${cand.namaWakil}`
            );
            showToast('success', 'Paslon Dihapus', 'Data pasangan calon berhasil dihapus.');
            if (editingCandidate?.id === cand.id) resetCandidateForm();
          }
        });
      };

      // ==========================================================================
      // HANDLER MODUL C: DATABASE MAHASISWA (DPT)
      // ==========================================================================
      const uniqueProdis = useMemo(
        () => Array.from(new Set(students.map((s) => s.prodi).filter(Boolean))),
        [students]
      );
      const uniqueAngkatans = useMemo(
        () => Array.from(new Set(students.map((s) => String(s.angkatan)).filter(Boolean))).sort(),
        [students]
      );

      const filteredStudents = useMemo(() => {
        return students
          .filter((s) => {
            const q = studentSearch.toLowerCase().trim();
            const matchQuery =
              !q ||
              String(s.nim).toLowerCase().includes(q) ||
              String(s.nama).toLowerCase().includes(q);
            const matchProdi = filterProdi === 'ALL' || s.prodi === filterProdi;
            const matchAngkatan =
              filterAngkatan === 'ALL' || String(s.angkatan) === filterAngkatan;
            const matchVote =
              filterVoteStatus === 'ALL' ||
              (filterVoteStatus === 'VOTED' && s.hasVoted) ||
              (filterVoteStatus === 'NOT_VOTED' && !s.hasVoted);
            return matchQuery && matchProdi && matchAngkatan && matchVote;
          })
          .sort((a, b) => String(a.nim).localeCompare(String(b.nim)));
      }, [students, studentSearch, filterProdi, filterAngkatan, filterVoteStatus]);

      const openAddStudentModal = () => {
        setEditingStudentNim(null);
        setStudentForm({
          nim: '',
          nama: '',
          prodi: 'S1 Farmasi',
          angkatan: '2024',
          eligibility: true
        });
        setStudentModalOpen(true);
      };

      const openEditStudentModal = (st) => {
        setEditingStudentNim(st.nim);
        setStudentForm({
          nim: st.nim,
          nama: st.nama,
          prodi: st.prodi,
          angkatan: String(st.angkatan),
          eligibility: st.eligibility !== false
        });
        setStudentModalOpen(true);
      };

      const handleSaveStudent = (e) => {
        e.preventDefault();
        const cleanNim = studentForm.nim.trim();
        if (!cleanNim || !studentForm.nama.trim()) {
          showToast('warning', 'Data Tidak Lengkap', 'NIM dan Nama Lengkap wajib diisi.');
          return;
        }

        if (!editingStudentNim && students.some((s) => String(s.nim).trim() === cleanNim)) {
          showToast(
            'error',
            'NIM Ganda Terdeteksi',
            `Mahasiswa dengan NIM ${cleanNim} sudah ada di DPT.`
          );
          return;
        }

        onUpdateDb((prev) => {
          const existing = prev.students.find((s) => String(s.nim).trim() === cleanNim);
          const updatedRecord = {
            nim: cleanNim,
            nama: studentForm.nama.trim(),
            prodi: studentForm.prodi.trim(),
            angkatan: String(studentForm.angkatan).trim(),
            eligibility: Boolean(studentForm.eligibility),
            hasVoted: existing ? Boolean(existing.hasVoted) : false,
            votedAt: existing ? existing.votedAt || null : null
          };
          const nextStudents = existing
            ? prev.students.map((s) => (String(s.nim).trim() === cleanNim ? updatedRecord : s))
            : [...prev.students, updatedRecord];
          return { ...prev, students: nextStudents };
        });

        logAudit(
          editingStudentNim ? 'EDIT_MAHASISWA' : 'TAMBAH_MAHASISWA',
          `${editingStudentNim ? 'Memperbarui' : 'Menambahkan'} data DPT NIM ${cleanNim} (${studentForm.nama.trim()})`
        );
        showToast('success', 'DPT Diperbarui', `Data mahasiswa ${cleanNim} berhasil disimpan.`);
        setStudentModalOpen(false);
      };

      const handleDeleteStudent = (st) => {
        setConfirmState({
          open: true,
          title: `Hapus Mahasiswa ${st.nim}?`,
          message: `Hapus ${st.nama} (${st.nim}) dari Daftar Pemilih Tetap?`,
          confirmLabel: 'Hapus dari DPT',
          onConfirm: () => {
            setConfirmState({ open: false });
            onUpdateDb((prev) => ({
              ...prev,
              students: prev.students.filter((s) => String(s.nim).trim() !== String(st.nim).trim())
            }));
            logAudit('HAPUS_MAHASISWA', `Menghapus mahasiswa NIM ${st.nim} (${st.nama}) dari DPT`);
            showToast('success', 'Dihapus dari DPT', `Mahasiswa ${st.nim} berhasil dihapus.`);
          }
        });
      };

      const handleCsvImport = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const text = await file.text();
          const lines = text
            .split(/\r?\n/)
            .map((l) => l.trim())
            .filter(Boolean);

          if (lines.length < 2) {
            showToast(
              'warning',
              'File Kosong',
              'File CSV harus memiliki baris header dan minimal 1 baris data.'
            );
            return;
          }

          const delimiter = lines[0].includes(';') ? ';' : ',';
          const existingSet = new Set(students.map((s) => String(s.nim).trim()));
          const newRecords = [];
          let duplicateCount = 0;

          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(delimiter).map((c) => c.replace(/^"|"$/g, '').trim());
            const [nimVal, namaVal, prodiVal, angkatanVal, eligVal] = cols;
            if (!nimVal || !namaVal) continue;

            if (existingSet.has(nimVal)) {
              duplicateCount += 1;
              continue;
            }

            existingSet.add(nimVal);
            const isEligible =
              eligVal === undefined || eligVal === ''
                ? true
                : ['true', '1', 'aktif', 'ya', 'yes'].includes(eligVal.toLowerCase());

            newRecords.push({
              nim: nimVal,
              nama: namaVal,
              prodi: prodiVal || 'S1 Farmasi',
              angkatan: angkatanVal || '2024',
              eligibility: isEligible,
              hasVoted: false,
              votedAt: null
            });
          }

          if (newRecords.length > 0) {
            onUpdateDb((prev) => ({
              ...prev,
              students: [...prev.students, ...newRecords]
            }));
            logAudit(
              'IMPORT_DPT_CSV',
              `Mengimpor ${newRecords.length} data mahasiswa baru via CSV (${duplicateCount} NIM duplikat dilewati)`
            );
          }

          showToast(
            'success',
            'Import CSV Selesai',
            `${newRecords.length} mahasiswa ditambahkan. ${duplicateCount} NIM ganda dilewati.`
          );
        } catch (err) {
          showToast('error', 'Gagal Import CSV', err.message);
        } finally {
          e.target.value = '';
        }
      };

      const handleDownloadCsvTemplate = () => {
        const csvContent =
          'NIM,Nama Lengkap,Program Studi,Angkatan,Hak Pilih\n240105101,Putri Maharani,S1 Farmasi,2024,Aktif\n240105102,Bagas Adi Saputra,D3 Farmasi,2024,Aktif\n';
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'Template_DPT_HIMAFA.csv';
        link.click();
        URL.revokeObjectURL(url);
      };

      const handleExportStudentsCsv = () => {
        const header =
          'NIM,Nama Lengkap,Program Studi,Angkatan,Hak Pilih,Status Memilih,Waktu Memilih\n';
        const rows = students
          .map(
            (s) =>
              `"${s.nim}","${s.nama}","${s.prodi}","${s.angkatan}","${
                s.eligibility ? 'Aktif' : 'Non-Aktif'
              }","${s.hasVoted ? 'Sudah Memilih' : 'Belum Memilih'}","${formatDateTimeID(
                s.votedAt
              )}"`
          )
          .join('\n');
        const blob = new Blob([header + rows], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `Database_DPT_HIMAFA_${new Date().toISOString().slice(0, 10)}.csv`;
        link.click();
        URL.revokeObjectURL(url);
        showToast('success', 'Export Berhasil', 'Database mahasiswa berhasil diunduh dalam format CSV.');
      };

      // ==========================================================================
      // HANDLER MODUL D: MANAJEMEN LOGO, TEKS BERANDA & JADWAL PEMILIHAN
      // ==========================================================================
      const handleLogoUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const compressedLogo = await compressImageToDataURL(file, 320, 0.88, true);
          setElectionForm((prev) => ({ ...prev, logoData: compressedLogo }));
          onUpdateDb((prev) => ({
            ...prev,

        const circumference = 2 * Math.PI * radius;

    // ============================================================================
    // 13. KOMPONEN UTAMA APLIKASI (STANDALONE GITHUB PAGES STATE ENGINE)
    // ============================================================================
    function App() {
      const [dbState, setDbState] = useState(() => loadInitialDatabase());
      const [voterStep, setVoterStep] = useState('LANDING');
      const [voterSession, setVoterSession] = useState(null);
      const [lastReceiptHash, setLastReceiptHash] = useState('');
      const [isSubmittingVote, setIsSubmittingVote] = useState(false);

      const [adminLoginModalOpen, setAdminLoginModalOpen] = useState(false);
      const [adminUser, setAdminUser] = useState(null);
      const [nowTick, setNowTick] = useState(Date.now());

      const [toasts, setToasts] = useState([]);
      const showToast = (type, title, message) => {
        const id = generateSecureToken();
        setToasts((prev) => [...prev, { id, type, title, message }]);
        setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 4500);
      };
      const removeToast = (id) => {
        setToasts((prev) => prev.filter((t) => t.id !== id));
      };

      // Sinkronisasi otomatis ke localStorage & antar-tab browser
      const updateDatabase = (updater) => {
        setDbState((prev) => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          try {
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
          } catch (err) {
            console.error('Penyimpanan lokal penuh:', err);
            showToast(
              'warning',
              'Memori Browser Penuh',
              'Gunakan gambar dengan ukuran lebih kecil agar penyimpanan tetap optimal.'
            );
          }
          return next;
        });
      };

      useEffect(() => {
        // Pastikan database awal tersimpan saat kunjungan perdana
        try {
          if (!window.localStorage.getItem(STORAGE_KEY)) {
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify(dbState));
          }
        } catch (e) {}

        // Sinkronisasi real-time jika dibuka di lebih dari 1 tab browser
        const handleStorageSync = (event) => {
          if (event.key === STORAGE_KEY && event.newValue) {
            try {
              const synced = JSON.parse(event.newValue);
              setDbState((prev) => ({
                ...prev,
                ...synced
              }));
            } catch (e) {}
          }
        };
        window.addEventListener('storage', handleStorageSync);
        return () => window.removeEventListener('storage', handleStorageSync);
      }, []);

      useEffect(() => {
        const timer = setInterval(() => setNowTick(Date.now()), 1000);
        return () => clearInterval(timer);
      }, []);

      const logAudit = (action, details, overrideAdmin) => {
        const newLog = {
          id: generateSecureToken(),
          adminId: overrideAdmin || adminUser || 'SYSTEM',
          action,
          details,
          timestamp: new Date().toISOString()
        };
        updateDatabase((prev) => ({
          ...prev,
          auditLogs: [newLog, ...(prev.auditLogs || [])]
        }));
      };

      const { config, students, candidates, ballots, auditLogs, adminAuth } = dbState;

      const electionPhase = useMemo(() => {
        if (!config.isOpen) {
          return {
            status: 'CLOSED',
            label: 'Pemilihan Ditutup',
            reason: 'Pemungutan suara sedang ditutup oleh panitia KPUM HIMAFA.'
          };
        }
        const startMs = new Date(config.startTime).getTime();
        const endMs = new Date(config.endTime).getTime();

        if (!isNaN(startMs) && nowTick < startMs) {
          return {
            status: 'UPCOMING',
            label: 'Belum Dimulai',
            reason: `Pemungutan suara baru akan dibuka pada ${formatDateTimeID(config.startTime)}.`
          };
        }
        if (!isNaN(endMs) && nowTick > endMs) {
          return {
            status: 'ENDED',
            label: 'Waktu Berakhir',
            reason: `Periode pemungutan suara telah berakhir pada ${formatDateTimeID(config.endTime)}.`
          };
        }
        return {
          status: 'ACTIVE',
          label: 'Pemilihan Berlangsung',
          reason: ''
        };
      }, [config.isOpen, config.startTime, config.endTime, nowTick]);

      const countdownText = useMemo(() => {
        const startMs = new Date(config.startTime).getTime();
        const endMs = new Date(config.endTime).getTime();
        let diff = 0;
        let prefix = '';

        if (electionPhase.status === 'UPCOMING' && !isNaN(startMs)) {
          diff = Math.max(0, startMs - nowTick);
          prefix = 'Dibuka dalam: ';
        } else if (electionPhase.status === 'ACTIVE' && !isNaN(endMs)) {
          diff = Math.max(0, endMs - nowTick);
          prefix = 'Sisa waktu: ';
        } else {
          return 'Periode pemungutan suara tidak aktif';
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / 1000 / 60) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        return `${prefix}${days}h ${String(hours).padStart(2, '0')}j ${String(minutes).padStart(
          2,
          '0'
        )}m ${String(seconds).padStart(2, '0')}d`;
      }, [config.startTime, config.endTime, electionPhase.status, nowTick]);

      // Penerbitan Token Sekali Pakai setelah verifikasi NIM DPT
      const handleCreateVoterSession = async (verifiedNim) => {
        const student = students.find((s) => String(s.nim).trim() === String(verifiedNim).trim());
        if (!student) {
          throw new Error('NIM tidak ditemukan di database DPT.');
        }
        if (student.hasVoted) {
          throw new Error('NIM ini sudah tercatat memberikan suara sebelumnya.');
        }
        if (!student.eligibility) {
          throw new Error('Status hak pilih Anda tidak aktif.');
        }

        const rawToken = generateSecureToken();
        const tokenHash = await sha256Hex(rawToken);

        updateDatabase((prev) => ({
          ...prev,
          tokens: {
            ...(prev.tokens || {}),
            [tokenHash]: {
              tokenHash,
              used: false,
              issuedAt: new Date().toISOString(),
              usedAt: null
            }
          }
        }));

        const sessionObj = { nim: student.nim, tokenHash };
        setVoterSession(sessionObj);
        setVoterStep('ENVELOPE');
        return sessionObj;
      };

      // Pencatatan Surat Suara Anonim Atomik (Tanpa NIM)
      const handleConfirmVoteTransaction = async (chosenCandidate, punchCoords = { x: 50, y: 46 }) => {
        if (!voterSession?.nim || !voterSession?.tokenHash) {
          showToast('error', 'Sesi Tidak Valid', 'Silakan ulangi verifikasi identitas DPT.');
          setVoterStep('VERIFY');
          return;
        }
        if (electionPhase.status !== 'ACTIVE' || config.isMaintenance) {
          showToast('error', 'Pemilihan Ditutup', 'Periode pemungutan suara sudah tidak aktif.');
          setVoterSession(null);
          setVoterStep('LANDING');
          return;
        }

        setIsSubmittingVote(true);
        try {
          const anonymousBallotId = generateSecureToken();
          const ballotIntegrityHash = await sha256Hex(
            `${anonymousBallotId}:${chosenCandidate.id}:${Date.now()}`
          );
          const nowIso = new Date().toISOString();

          const currentStudent = dbState.students.find(
            (s) => String(s.nim).trim() === String(voterSession.nim).trim()
          );
          const currentToken = dbState.tokens?.[voterSession.tokenHash];

          if (!currentStudent) {
            throw new Error('Data mahasiswa tidak ditemukan di DPT.');
          }
          if (!currentStudent.eligibility) {
            throw new Error('Mahasiswa tidak memiliki hak pilih aktif.');
          }
          if (currentStudent.hasVoted) {
            throw new Error('Hak pilih sudah digunakan sebelumnya. Pengiriman suara ganda ditolak.');
          }
          if (!currentToken || currentToken.used) {
            throw new Error('Token pemilihan sudah kedaluwarsa atau telah terpakai.');
          }

          const newBallotRecord = {
            id: anonymousBallotId,
            candidateId: chosenCandidate.id,
            nomorUrut: Number(chosenCandidate.nomorUrut),
            punchX: typeof punchCoords?.x === 'number' ? punchCoords.x : 50,
            punchY: typeof punchCoords?.y === 'number' ? punchCoords.y : 46,
            ballotHash: ballotIntegrityHash,
            createdAt: nowIso
          };

          updateDatabase((prev) => ({
            ...prev,
            students: prev.students.map((st) =>
              String(st.nim).trim() === String(voterSession.nim).trim()
                ? { ...st, hasVoted: true, votedAt: nowIso }
                : st
            ),
            tokens: {
              ...(prev.tokens || {}),
              [voterSession.tokenHash]: {
                ...prev.tokens[voterSession.tokenHash],
                used: true,
                usedAt: nowIso
              }
            },
            ballots: [...(prev.ballots || []), newBallotRecord]
          }));

          setVoterSession(null);
          setLastReceiptHash(ballotIntegrityHash);
          setVoterStep('SUCCESS');
        } catch (err) {
          showToast('error', 'Pengiriman Suara Gagal', err.message || 'Gagal merekam surat suara.');
        } finally {
          setIsSubmittingVote(false);
        }
      };

      const handleCompleteVoterReset = () => {
        setVoterSession(null);
        setLastReceiptHash('');
        setVoterStep('LANDING');
      };

      const handleExportFullBackup = () => {
        const blob = new Blob([JSON.stringify(dbState, null, 2)], {
          type: 'application/json;charset=utf-8;'
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `Backup_Evoting_HIMAFA_${new Date().toISOString().slice(0, 10)}.json`;
        link.click();
        URL.revokeObjectURL(url);
        logAudit('BACKUP_DATABASE_JSON', 'Mengunduh file cadangan JSON seluruh database pemilihan');
        showToast('success', 'Backup Diunduh', 'File cadangan JSON berhasil diunduh.');
      };

      const handleImportFullBackup = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          if (!parsed || !parsed.config || !Array.isArray(parsed.students) || !Array.isArray(parsed.candidates)) {
            throw new Error('Format file cadangan JSON tidak valid.');
          }
          updateDatabase({
            config: { ...DEFAULT_ELECTION_CONFIG, ...parsed.config },
            students: parsed.students,
            candidates: parsed.candidates,
            ballots: Array.isArray(parsed.ballots) ? parsed.ballots : [],
            tokens: parsed.tokens && typeof parsed.tokens === 'object' ? parsed.tokens : {},
            auditLogs: Array.isArray(parsed.auditLogs) ? parsed.auditLogs : [],
            adminAuth: parsed.adminAuth || adminAuth
          });
          logAudit('RESTORE_DATABASE_JSON', 'Memulihkan database pemilihan dari file cadangan JSON');
          showToast('success', 'Pemulihan Berhasil', 'Seluruh data pemilihan berhasil dipulihkan.');
        } catch (err) {
          showToast('error', 'Gagal Memulihkan Backup', err.message);
        } finally {
          e.target.value = '';
        }
      };

      return (
        <LogoContext.Provider value={config.logoData || ''}>
          <ToastContainer toasts={toasts} removeToast={removeToast} />

          {adminUser ? (
            <AdminDashboard
              adminUser={adminUser}
              config={config}
              students={students}
              candidates={candidates}
              ballots={ballots}
              auditLogs={auditLogs}
              onUpdateDb={updateDatabase}
              onExportFullBackup={handleExportFullBackup}
              onImportFullBackup={handleImportFullBackup}
              onLogout={() => {
                logAudit('LOGOUT_ADMIN', `Administrator ${adminUser} keluar dari dashboard`);
                setAdminUser(null);
                setVoterStep('LANDING');
                showToast('info', 'Logout Berhasil', 'Sesi administrator telah diakhiri.');
              }}
              logAudit={logAudit}
              showToast={showToast}
            />
          ) : (
            <>
              {voterStep === 'LANDING' && (
                <LandingPage
                  config={config}
                  electionPhase={electionPhase}
                  countdownText={countdownText}
                  candidates={candidates}
                  ballots={ballots}
                  students={students}
                  onStartVoting={() => {
                    if (electionPhase.status !== 'ACTIVE' || config.isMaintenance) {
                      showToast(
                        'warning',
                        'Pemilihan Tidak Aktif',
                        electionPhase.reason || 'Pemungutan suara sedang tidak dibuka.'
                      );
                      return;
                    }
                    setVoterSession(null);
                    setVoterStep('VERIFY');
                  }}
                  onOpenAdminModal={() => setAdminLoginModalOpen(true)}
                />
              )}

              {voterStep === 'VERIFY' && (
                <VoterVerificationPage
                  students={students}
                  onBackHome={() => setVoterStep('LANDING')}
                  onCreateVoterSession={handleCreateVoterSession}
                  showToast={showToast}
                />
              )}

              {voterStep === 'ENVELOPE' && voterSession && (
                <DigitalEnvelopePage
                  period={config.period}
                  onEnvelopeOpened={() => setVoterStep('BALLOT')}
                />
              )}

              {voterStep === 'BALLOT' && voterSession && (
                <BallotSelectionPage
                  config={config}
                  candidates={candidates}
                  onSubmitVote={handleConfirmVoteTransaction}
                  isSubmitting={isSubmittingVote}
                />
              )}

              {voterStep === 'SUCCESS' && (
                <VoteSuccessPage
                  receiptHash={lastReceiptHash}
                  onCompleteReset={handleCompleteVoterReset}
                />
              )}

              <AdminLoginModal
                open={adminLoginModalOpen}
                onClose={() => setAdminLoginModalOpen(false)}
                adminAuth={adminAuth}
                onInitAdminAuth={(newAuthObj) =>
                  updateDatabase((prev) => ({ ...prev, adminAuth: newAuthObj }))
                }
                onLoginSuccess={(loggedUser) => {
                  setAdminUser(loggedUser);
                  setAdminLoginModalOpen(false);
                  logAudit('LOGIN_ADMIN', `Administrator ${loggedUser} masuk ke dashboard`, loggedUser);
                  showToast('success', 'Login Berhasil', `Selamat datang, ${loggedUser}.`);
                }}
                showToast={showToast}
              />
            </>
          )}
        </LogoContext.Provider>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
